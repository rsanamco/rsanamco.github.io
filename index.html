<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>RSANAMCO | Background Art</title><style>*{box-sizing:border-box}body{background:#151515;color:#eee;font:16px system-ui;margin:auto;max-width:1200px;padding:30px}a{color:#d5b992}header{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}h1{font-size:clamp(32px,6vw,70px)}p{color:#bbb;white-space:pre-wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:22px}button{background:#222;color:#eee;border:1px solid #444;padding:12px;cursor:pointer;text-align:left;font:inherit}img{width:100%;display:block;object-fit:contain}button img{aspect-ratio:16/10;object-fit:cover}dialog{background:#181818;color:white;border:1px solid #555;width:min(95vw,1000px);max-height:90vh}dialog img{margin:20px 0}section{margin:60px 0}dialog::backdrop{background:#000b}</style></head><body><header><b>RSANAMCO</b><nav><a href='#work'>Work</a> · <a href='#about'>About</a> · <a href='#contact'>Contact</a></nav></header><h1>Background Art & Visual Development</h1><p>Hand-painted worlds for animation.</p><section id=work><h2>Selected projects</h2><div class=grid id=gallery></div></section><section id=about><h2>About</h2><p id=bio></p></section><section id=contact><h2>Contact</h2><div id=links></div></section><dialog id=detail><button onclick='this.parentElement.close()'>Close ×</button><div id=content></div></dialog><script>const el=(tag,t)=>{let e=document.createElement(tag);if(t)e.textContent=t;return e};function link(parent,label,url){try{let u=new URL(url);if(!['https:','http:','mailto:'].includes(u.protocol))return;let a=el('a',label);a.href=u.href;parent.append(a,el('br'))}catch{}}function photo(src){let i=el('img');i.src=src;i.alt='Portfolio artwork';i.loading='lazy';return i}fetch('portfolio.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{bio.textContent=d.bio; if(d.email)link(links,d.email,'mailto:'+d.email);for(let k of ['linkedin','instagram','artstation'])if(d[k])link(links,k,d[k]);if(!d.albums.length)gallery.textContent='New projects coming soon.';d.albums.forEach(a=>{let b=el('button');if(a.images.length)b.append(photo(a.images[0]));b.append(el('h3',a.title));gallery.append(b);b.onclick=()=>{content.replaceChildren(el('h2',a.title),el('p',a.description));a.images.forEach(s=>content.append(photo(s)));a.videos.forEach(v=>link(content,'Watch video ↗',v));detail.showModal()}})}).catch(()=>gallery.textContent='Portfolio could not load.');</script></body></html>
