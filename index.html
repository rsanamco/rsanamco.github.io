<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><meta name="description" content="Animation background art portfolio"><title>RSANAMCO | Background Art</title><style>*{box-sizing:border-box}body{background:#151515;color:#eee;font:16px system-ui;margin:auto;max-width:1200px;padding:30px}a{color:#d5b992}header{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}h1{font-size:clamp(32px,6vw,70px)}p{color:#bbb;white-space:pre-wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:22px}button{background:#222;color:#eee;border:1px solid #444;padding:12px;cursor:pointer;text-align:left;font:inherit}img{width:100%;display:block;object-fit:contain}button img{aspect-ratio:16/10;object-fit:cover}dialog{background:#181818;color:white;border:1px solid #555;width:min(95vw,1000px);max-height:90vh}dialog img{margin:20px 0}section{margin:60px 0}dialog::backdrop{background:#000b}.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:#eee;letter-spacing:.12em}.brand img{width:72px;height:72px;object-fit:contain}.hero-media{margin:24px 0;overflow:hidden;border-radius:12px}.hero-media img,.hero-media video{width:100%;max-height:440px;object-fit:contain;display:block}header{align-items:center}nav a{text-decoration:none} @media(max-width:500px){.brand img{width:56px;height:56px}} body{background:var(--background,#151515);color:var(--text,#eee);font-family:var(--bodyFont,system-ui);font-size:var(--bodySize,16px)}a{color:var(--accent,#d5b992)}p{color:var(--muted,#bbb)}.brand{color:var(--text,#eee)}button,dialog{background:var(--card,#222);color:var(--text,#eee);border-color:var(--muted,#555)}#heroTitle{font-family:var(--titleFont,system-ui);font-size:clamp(24px,8vw,var(--titleSize,64px));color:var(--titleColor,#eee)}#heroSubtitle{font-family:var(--subtitleFont,system-ui);font-size:var(--subtitleSize,20px);color:var(--subtitleColor,#bbb)}@media(max-width:600px){#gallery{grid-template-columns:1fr!important;columns:1!important}body{padding:16px}}#highlights img{object-fit:contain}#extras img{max-width:160px}#filters button{margin:4px}footer{padding:24px 0}</style></head><body><header><a class="brand" href="#"><span id="logo"></span><b id="brandName">RSANAMCO</b></a><nav><a href='#work'>Work</a> · <a href='#about'>About</a> · <a href='#contact'>Contact</a> · <button id="mode" hidden>Light / dark</button></nav></header><h1 id="heroTitle">Background Art & Visual Development</h1><p id="heroSubtitle">Hand-painted worlds for animation.</p><div id="banner" class="hero-media"></div><div id="highlights"></div><section id=work><h2>Selected projects</h2><div id="filters"></div><div class=grid id=gallery></div></section><section id=about><h2>About</h2><p id=bio></p><div id="extras"></div></section><section id=contact><h2>Contact</h2><div id=links></div></section><footer id="footer"></footer><dialog id=detail><button onclick='this.parentElement.close()'>Close ×</button><div id=content></div></dialog><script>const themes={Dark:['#151515','#eeeeee','#d5b992','#222222','#bbbbbb'],Light:['#faf9f6','#252525','#805b39','#ffffff','#555555'],Warm:['#eee4d4','#49382e','#85563c','#fff6e9','#665247'],Pastel:['#eee8f5','#40364f','#785b9e','#faf5ff','#62556e'],Forest:['#172821','#e5eee5','#a9c99b','#243a30','#c0d0c4'],Midnight:['#161c30','#edf0ff','#aebaff','#242d47','#bbc4df']};const fonts={'Modern':'system-ui,sans-serif','Classic serif':'Georgia,serif','Elegant serif':'"Times New Roman",serif','Rounded':'"Trebuchet MS",sans-serif','Clean sans':'Arial,sans-serif','Monospace':'monospace'};const keys=['background','text','accent','card','muted'];function appearance(a={}){let t=themes[a.theme]||themes.Dark;return {...Object.fromEntries(keys.map((k,i)=>[k,t[i]])),titleFont:'Modern',subtitleFont:'Modern',bodyFont:'Modern',titleSize:64,subtitleSize:20,bodySize:16,titleColor:a.text||t[1],subtitleColor:a.muted||t[4],...a}}function applyAppearance(node,a){a=appearance(a);for(const k of [...keys,'titleColor','subtitleColor'])if(/^#[0-9a-f]{6}$/i.test(a[k]))node.style.setProperty('--'+k,a[k]);for(const k of ['title','subtitle','body']){node.style.setProperty('--'+k+'Font',fonts[a[k+'Font']]||fonts.Modern);node.style.setProperty('--'+k+'Size',Math.max(10,Math.min(120,Number(a[k+'Size'])||16))+'px')}}const el=(tag,t)=>{let e=document.createElement(tag);if(t)e.textContent=t;return e};function link(parent,label,url){try{let u=new URL(url);if(!['https:','http:','mailto:'].includes(u.protocol))return;let a=el('a',label);a.href=u.href;parent.append(a,el('br'))}catch{}}function photo(src){let i=el('img');i.src=src;i.alt='Portfolio artwork';i.loading='lazy';return i}let slideTimer;function media(src){if(/\.(mp4|webm)(\?|$)/i.test(src||'')){let v=el('video');v.src=src;v.controls=true;v.playsInline=true;v.style.width='100%';return v}let im=photo(src);im.onclick=()=>{let d=document.createElement('dialog');d.append(photo(src));let b=el('button','Close');b.onclick=()=>d.close();d.prepend(b);document.body.append(d);d.onclose=()=>d.remove();d.showModal()};return im}function render(d){clearInterval(slideTimer);let o=d.options||{},get=id=>document.getElementById(id);applyAppearance(document.documentElement,d.appearance);for(let id of ['logo','banner','gallery','links','highlights','filters','extras'])get(id).replaceChildren();get('brandName').textContent=d.brandName||'RSANAMCO';get('heroTitle').textContent=d.heroTitle||'Background Art & Visual Development';get('heroSubtitle').textContent=d.heroSubtitle||'Hand-painted worlds for animation.';if(d.logo){let im=photo(d.logo);im.style.width=im.style.height=(Number(o.logoSize)||72)+'px';get('logo').append(im)}if(d.banner)get('banner').append(media(d.banner));if(o.favicon){let f=document.createElement('link');f.rel='icon';f.href=o.favicon;document.head.append(f)}if(o.seo)document.querySelector('meta[name=description]').content=o.seo;if(o.cursor)document.body.style.cursor=o.cursorImage?'url('+JSON.stringify(o.cursorImage)+'), auto':'crosshair';get('bio').textContent=d.bio||'';if(o.profilePhoto)get('extras').append(photo(o.profilePhoto));if(o.skills)get('extras').append(el('p',o.skills));if(o.cv){let a=el('a','Download CV');a.href=o.cv;get('extras').append(a)}if(o.showreel)link(get('extras'),'Watch showreel',o.showreel);if(o.availability)get('extras').prepend(el('p','● Available for work'));if(d.email)link(links,d.email,'mailto:'+d.email);for(let k of ['linkedin','instagram','artstation'])if(d[k])link(links,k,d[k]);get('footer').textContent=o.footer||'© '+(d.brandName||'RSANAMCO');get('mode').hidden=!o.mode;get('mode').onclick=()=>{let light=document.body.dataset.light!=='yes';document.body.dataset.light=light?'yes':'no';applyAppearance(document.documentElement,light?{theme:'Light'}:d.appearance)};let slides=(d.highlights||[]).filter(h=>h.media),n=0;function slide(){let s=get('highlights');s.replaceChildren();if(!slides.length)return;let h=slides[n],m=media(h.media);m.style.maxHeight=(Number(o.slideHeight)||500)+'px';s.append(m,el('h2',h.title),el('p',h.description));if(h.url)link(s,'Explore',h.url);if(h.project){let a=el('a','View project');a.href='#project='+encodeURIComponent(h.project);s.append(a)}for(let [label,step] of [['Previous',-1],['Next',1]]){let b=el('button',label);b.onclick=()=>{n=(n+step+slides.length)%slides.length;slide()};s.append(b)}}slide();if(o.slideshow&&slides.length>1&&!matchMedia('(prefers-reduced-motion: reduce)').matches)slideTimer=setInterval(()=>{n=(n+1)%slides.length;slide()},Math.max(3,Number(o.slideSeconds)||5)*1000);let albums=(d.albums||[]).filter(a=>!a.hidden&&!a.draft);function show(a){content.replaceChildren(el('h2',a.title),el('p',a.description));for(let k of ['role','software','year','projectType'])if(a[k])content.append(el('p',k+': '+a[k]));for(let s of a.images||[])content.append(media(s));for(let v of a.videos||[])video(content,v);for(let v of (a.links||'').split('\n'))if(v)link(content,v,v);for(let b of a.blocks||[]){let t=b.type,v=b.value;if(t==='heading')content.append(el('h3',v));else if(t==='text')content.append(el('p',v));else if(t==='image')content.append(media(v));else if(t==='video')video(content,v);else if(t==='link')link(content,b.second||v,v);else if(t==='divider')content.append(el('hr'));else if(t==='spacer'){let q=el('div');q.style.height='40px';content.append(q)}else if(t==='comparison'){let q=el('div'),top=photo(b.second),bottom=photo(v),r=el('input');q.style.position='relative';top.style.cssText='position:absolute;inset:0;height:100%;object-fit:contain;clip-path:inset(0 50% 0 0)';q.append(bottom,top);r.type='range';r.value=50;r.oninput=()=>top.style.clipPath='inset(0 '+(100-r.value)+'% 0 0)';content.append(q,r)}}if(!detail.open)detail.showModal()}function video(parent,v){try{let u=new URL(v,location.href),id;if(u.hostname==='youtu.be')id=u.pathname.slice(1);else if(['youtube.com','www.youtube.com'].includes(u.hostname))id=u.searchParams.get('v');let src=id&&/^[\w-]+$/.test(id)?'https://www.youtube-nocookie.com/embed/'+id:null;if(u.hostname==='vimeo.com'&&/^\/\d+$/.test(u.pathname))src='https://player.vimeo.com/video'+u.pathname;if(src){let f=el('iframe');f.src=src;f.loading='lazy';f.allowFullscreen=true;f.style.cssText='width:100%;aspect-ratio:16/9;border:0';parent.append(f)}else if(/\.(mp4|webm)$/i.test(v))parent.append(media(v));else link(parent,'Watch video',v)}catch{}}function grid(cat){gallery.replaceChildren();gallery.style.gap=(Number(o.gap)||22)+'px';gallery.style.gridTemplateColumns=o.layout==='full'?'1fr':`repeat(${Math.max(1,Math.min(4,Number(o.columns)||2))},minmax(0,1fr))`;gallery.style.display=o.layout==='masonry'?'block':'grid';if(o.layout==='masonry')gallery.style.columns=String(Math.max(1,Math.min(4,Number(o.columns)||2)));else gallery.style.columns='auto';for(let a of albums.filter(a=>!cat||a.category===cat)){let b=el('button');b.style.cssText='width:100%;break-inside:avoid;margin-bottom:8px;border-radius:'+(Number(o.radius)||0)+'px';if(a.images?.length)b.append(photo(a.images[0]));b.append(el('h3',a.title));gallery.append(b);b.onclick=()=>{location.hash='project='+encodeURIComponent(a.title);show(a)}}}for(let c of ['',...new Set(albums.map(a=>a.category).filter(Boolean))]){let b=el('button',c||'All');b.onclick=()=>grid(c);get('filters').append(b)}grid('');function route(){if(location.hash.startsWith('#project=')){let a=albums.find(a=>a.title===decodeURIComponent(location.hash.slice(9)));if(a)show(a)}}window.onhashchange=route;detail.onclose=()=>{if(location.hash.startsWith('#project='))history.replaceState(null,'','#work')};route();if(o.loading&&!matchMedia('(prefers-reduced-motion: reduce)').matches){let l=el('div');l.style.cssText='position:fixed;inset:0;z-index:99;background:var(--background);display:grid;place-items:center';l.append(o.loadingImage?photo(o.loadingImage):el('h2',d.brandName||'RSANAMCO'));document.body.append(l);setTimeout(()=>l.remove(),800)}if(o.analytics&&!location.search.includes('preview')&&!location.search.includes('edit=1')){try{let u=new URL(o.analytics);if(u.protocol==='https:'&&u.hostname.endsWith('.goatcounter.com')){let s=el('script');s.src='https://gc.zgo.at/count.js';s.dataset.goatcounter=u.href;document.head.append(s)}}catch{}}}if(location.search.includes('preview=1')){window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===window.opener&&e.data?.portfolioPreview)render(e.data.portfolioPreview)})}else fetch('portfolio.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{window.portfolioData=d;render(d);if(window.visualRefresh)window.visualRefresh()}).catch(()=>gallery.textContent='Portfolio could not load.');</script><script src="visual.js"></script></body></html>
