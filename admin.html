<!doctype html><html><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Portfolio editor</title><style>body{background:#171717;color:#eee;font:16px system-ui;max-width:800px;margin:auto;padding:20px}input,textarea,button{font:inherit;padding:10px;margin:5px 0;background:#292929;color:white;border:1px solid #666;border-radius:5px}input,textarea{width:100%;box-sizing:border-box}button{cursor:pointer}section{border:1px solid #555;padding:15px;margin:15px 0}label{display:block}a{color:#ddd}</style><h1>RSANAMCO editor</h1><p>Enter a GitHub fine-grained token with Contents read/write access only to your portfolio repository. It stays in this tab's memory. Never share it.</p><input id=token type=password placeholder='GitHub token'><button id=load>Connect / reload</button><p id=status role=status></p><div id=editor hidden><div id=fields></div><div id=albums></div><button id=add>Add album</button> <button id=save>Publish changes</button></div><script>
const $=id=>document.getElementById(id),base='https://api.github.com/repos/rsanamco/rsanamco.github.io/contents/';let data,sha,key;async function api(path,body){let r=await fetch(base+path,{method:body?'PUT':'GET',headers:{Authorization:'Bearer '+key,Accept:'application/vnd.github+json','Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok)throw Error('GitHub error '+r.status);return r.json()}function b64(s){return btoa(Array.from(new TextEncoder().encode(s),x=>String.fromCharCode(x)).join(''))}function field(parent,label,value,change,multi=false){let l=document.createElement('label');l.textContent=label;let i=document.createElement(multi?'textarea':'input');i.value=value;i.oninput=()=>change(i.value);l.append(i);parent.append(l)}function btn(parent,t,fn){let b=document.createElement('button');b.textContent=t;b.onclick=fn;parent.append(b)}async function uploadHeader(file,kind){if(!file)return;const ext=file.name.split('.').pop().toLowerCase();if(!(kind==='logo'?/^(png|apng|gif|jpg|jpeg|webp)$/:/^(png|apng|gif|jpg|jpeg|webp|mp4|webm)$/).test(ext))throw Error('Unsupported file format');if(file.size>10*1024*1024)throw Error('Use files under 10 MB');const path='artwork/'+crypto.randomUUID()+'.'+ext;const encoded=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(file)});await api(path,{message:'Upload '+kind,content:encoded,branch:'main'});data[kind]=path}function headerEditor(parent){let s=document.createElement('section');parent.append(s);let h=document.createElement('h2');h.textContent='Website appearance';s.append(h);for(let [k,label,def] of [['brandName','Artist name','RSANAMCO'],['heroTitle','Main title','Background Art & Visual Development'],['heroSubtitle','Subtitle','Hand-painted worlds for animation.']])field(s,label,data[k]??def,v=>data[k]=v);for(let kind of ['logo','banner']){let l=document.createElement('label');l.textContent=kind==='logo'?'Character / logo (PNG, APNG, GIF or image)':'Optional banner (image or MP4 / WebM)';s.append(l);if(data[kind]){let m=document.createElement(/\.(mp4|webm)$/i.test(data[kind])?'video':'img');m.src=data[kind];m.style.maxWidth='180px';m.controls=true;s.append(m);btn(s,'Remove '+kind,()=>{delete data[kind];render()})}let f=document.createElement('input');f.type='file';f.accept=kind==='logo'?'image/*':'image/*,video/mp4,video/webm';l.append(f);f.onchange=async()=>{f.disabled=true;$('save').disabled=true;try{$('status').textContent='Uploading '+kind+'…';await uploadHeader(f.files[0],kind);render();$('status').textContent='Uploaded. Click Publish changes.'}catch(e){$('status').textContent=e.message}finally{f.disabled=false;$('save').disabled=false}}}}function render(){$('fields').replaceChildren();headerEditor($('fields'));for(let k of ['bio','email','linkedin','instagram','artstation'])field($('fields'),k,data[k]||'',v=>data[k]=v,k==='bio');$('albums').replaceChildren();data.albums.forEach((a,n)=>{let s=document.createElement('section');$('albums').append(s);field(s,'Album title',a.title,v=>a.title=v);field(s,'Description',a.description,v=>a.description=v,true);field(s,'Video links (one URL per line)',a.videos.join('\n'),v=>a.videos=v.split('\n').map(x=>x.trim()).filter(Boolean),true);a.images.forEach((p,i)=>{let row=document.createElement('div');row.textContent=p.split('/').pop()+' ';btn(row,'Cover / move first',()=>{a.images.splice(i,1);a.images.unshift(p);render()});btn(row,'Remove',()=>{a.images.splice(i,1);render()});s.append(row)});let f=document.createElement('input');f.type='file';f.accept='image/jpeg,image/png,image/webp,image/gif';f.multiple=true;s.append(f);f.onchange=async()=>{try{for(let file of f.files){if(file.size>10*1024*1024)throw Error('Use images under 10 MB');if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type))throw Error('Unsupported image');let path='artwork/'+crypto.randomUUID()+'.'+file.type.split('/')[1];let encoded=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(file)});await api(path,{message:'Upload artwork',content:encoded,branch:'main'});a.images.push(path)}$('status').textContent='Images uploaded. Click Publish changes.';render()}catch(e){$('status').textContent=e.message}};btn(s,'Move album up',()=>{if(n){[data.albums[n-1],data.albums[n]]=[a,data.albums[n-1]];render()}});btn(s,'Delete album',()=>{if(confirm('Remove album from gallery?')){data.albums.splice(n,1);render()}})})} $('load').onclick=async()=>{try{key=$('token').value;let r=await api('portfolio.json?ref=main');sha=r.sha;data=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(r.content),c=>c.charCodeAt(0))));$('token').value='';$('editor').hidden=false;render();$('status').textContent='Connected'}catch(e){$('status').textContent=e.message}};$('add').onclick=()=>{data.albums.push({title:'New project',description:'',images:[],videos:[]});render()};$('save').onclick=async()=>{try{let r=await api('portfolio.json',{message:'Update portfolio',content:b64(JSON.stringify(data,null,2)),sha,branch:'main'});sha=r.content.sha;$('status').textContent='Saved to GitHub. Website deployment may take a few minutes.'}catch(e){$('status').textContent=e.message}};
</script></html>
